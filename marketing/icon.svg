<?xml version="1.0" encoding="UTF-8"?>
<!--
    Squelch P2P marketing icon (512x512).
    This is a hand-tuned SVG; designers can tweak proportions freely
    without touching the Android resources.

    To produce a PNG for Play / App Store:
        rsvg-convert -w 1024 -h 1024 marketing/icon.svg > icon-1024.png
        rsvg-convert -w 512  -h 512  marketing/icon.svg > icon-512.png
        rsvg-convert -w 192  -h 192  marketing/icon.svg > icon-192.png
    Or use Inkscape CLI on macOS.

    The mark itself is intentionally identical to the Android adaptive
    icon's foreground vector - kept in sync via the dedicated drawable
    XML in app/src/main/res/drawable/ic_launcher_foreground.xml.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="halo" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFB000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0A0A12" />
  <rect width="512" height="512" fill="url(#halo)" />

  <g transform="translate(256 256)">
    <circle r="160" fill="none" stroke="#1F7C32" stroke-width="6" />
    <circle r="118" fill="none" stroke="#0F5824" stroke-width="5" />
    <circle r="76"  fill="none" stroke="#1F7C32" stroke-width="5" />

    <path d="M40,-30 C70,-10 70,10 10,0 C-50,10 -50,30 10,40"
          fill="none" stroke="#00FF41" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />

    <circle r="14" fill="#00FF41" />

    <line x1="-180" y1="-40" x2="180" y2="-40" stroke="#FFB000" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="-180" y1="40"  x2="180" y2="40"  stroke="#FFB000" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>